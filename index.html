<!DOCTYPE html>
<html>
<head>
  <title>Campus Lost and Found</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, textarea, button {
      width: 100%;
      margin: 8px 0;
      padding: 10px;
    }
    button {
      background: #2ecc71;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #27ae60;
    }
  </style>
</head>
<body>

  <h1>Campus Lost & Found</h1>

  <div class="container">
    <h3>Report Lost / Found Item</h3>

    <input type="text" placeholder="Item Name">
    <input type="text" placeholder="Your Name">
    <input type="text" placeholder="Contact Number">
    <textarea placeholder="Item Description"></textarea>

    <button>Submit</button>
  </div>

</body>
</html>
